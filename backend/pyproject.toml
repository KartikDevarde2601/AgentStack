[project]
name = "agentstack-backend"
version = "0.1.0"
description = "Deep Research Agent backend using FastAPI, OpenAI SDK, OpenAI ChatKit, Temporal, and Postgres"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.60.0",
    "openai-agents>=0.25.0",
    "openai-chatkit",
    "temporalio[openai-agents,opentelemetry]>=1.9.0",
    "psycopg[binary,pool]>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
